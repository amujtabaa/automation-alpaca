name: Mutation ratchet (nightly)

# ADR-015: generated mutation testing over the derived-truth kernel. Hand-picked
# mutation checks have twice recorded proofs that a generated mutant refuted
# (REV-0045 P0-2's epoch-1-only seed survivor; REV-0038 F4) — a hand-picked
# mutant only ever proves the author thought of that mutant. This job generates
# the ones nobody thought of. Nightly, not per-push: a full mutmut pass over the
# projector is minutes-to-hours, not seconds.
#
# Ratchet discipline mirrors the coverage floor: the surviving-mutant count may
# only shrink. The first green run establishes the baseline; record it in
# pkl/architecture/testing-model.md and lower MAX_SURVIVORS to match.

on:
  schedule:
    - cron: "17 9 * * *" # daily, off the top-of-hour thundering herd
  workflow_dispatch: {}

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # FIRST RECORDED BASELINE (2026-07-29, WO-0141R). Measured on a
      # completed run at the branch head:
      #   generated 1223 | killed 1017 | detected_by_timeout 1 | survived 205
      # The sentinel is retired. 205 is a MEASUREMENT, not a target: it has not
      # been triaged, and an unknown share are equivalent mutants. Lowering it
      # as survivors are dispositioned is the ratchet; raising it needs an ADR
      # amendment.
      #
      # Read the two earlier numbers before trusting this one. With the
      # pre-existing test selection the same code measured 593 non-killed, of
      # which 270 were "no tests" — because the selection named four files and
      # the ratchet mutates the whole module. That number measured the
      # SELECTION, not the tests. tests/test_ratchet_selection_is_complete.py
      # now fails the build if the selection falls behind again.
      #
      # KNOWN-LOOSE BY AT LEAST SIX as of 6624a62.
      # tests/test_wo0141_mutation_triage_gaps.py kills six survivors that this
      # baseline counted: contributed_epoch_sequence 10/12/15 and
      # release_key_claim 16/17/21, each certified RED->GREEN individually.
      # The ceiling is deliberately NOT lowered to 199 here: 205 minus 6 is
      # arithmetic, and adding a test module to the selection can move other
      # cells too. The next completed run measures the real number; lower it to
      # THAT. A ceiling that is known-loose and says so beats one that is
      # precise and guessed.
      #
      # ALSO WORTH KNOWING, from triaging those six: three of them were in
      # guards that _apply_producer_quarantined already enforces upstream, so
      # their survival was reporting UNREACHABILITY, not a test gap. A survivor
      # set is a reachability oracle; coverage is not. Read survivors that way
      # before assuming each one is a missing assertion.
      MAX_SURVIVORS: "205"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-mutation.txt
      # STATUS: REPORT-ONLY until the first reviewed baseline is recorded
      # (ADR-015; AUDIT-0003 amendment 2026-07-28). Run-state guard below makes
      # silence fail loudly: a tool crash or an empty mutant population is a
      # distinct failure, never a clean pass — a zero-survivor grep over a run
      # that never happened is exactly the inert-evidence class S-3 names.
      - name: Run mutation testing
        run: |
          set +e
          mutmut run
          echo "mutmut run exit: $?"
          set -e
          # --all is REQUIRED (without it mutmut suppresses killed results, so a
          # fully-killed run looks identical to an empty population) and in
          # mutmut 3.6.0 it takes a BOOLEAN ARGUMENT: bare `--all` exits with
          # "Option '--all' requires an argument" and writes nothing. The P1-5
          # repair fixed the parser against fixtures and never ran the real
          # command, so the job stayed broken in a new way. Verified against the
          # installed tool, not against a docstring.
          mutmut results --all True > results.txt 2>&1 || true
          head -20 results.txt
      - name: Classify the run and enforce the ratchet
        # Parsing lives in a committed, unit-tested script (P1-5): the previous
        # inline grep could not match mutmut 3.6.0's indented output, so the
        # job was permanently NO_MUTANTS and the ratchet was unreachable.
        run: python .ai-os/scripts/check_mutation_run.py results.txt --max-survivors "$MAX_SURVIVORS"
