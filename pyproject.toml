# No build-system section on purpose: this is an application repo, not an
# installable package. This file only configures the test runner.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Async tests use the bundled anyio plugin (see conftest.py at the repo root for
# the asyncio-only backend fixture). Unit tests remain IO-free (Rule 9).
# Coverage is NOT in addopts on purpose: a bare `pytest tests/test_x.py` for one
# file shouldn't trip the whole-suite floor. CI runs `pytest --cov=app
# --cov-branch` explicitly (see .github/workflows/ci.yml); the floor below then
# applies.
# A leaked/unclosed sqlite connection (F-008) surfaces as a ResourceWarning at
# GC; promote it to an error so a future fixture that forgets to close its store
# fails the suite instead of warning quietly.
#
# AIR-011: on Python 3.13+ an unraisable ResourceWarning (one raised inside a
# GC'd object's __del__, e.g. sqlite3.Connection) is delivered by pytest's
# unraisableexception plugin WRAPPED in ``PytestUnraisableExceptionWarning`` —
# which is NOT a ``ResourceWarning`` subclass, so the plain ``error::
# ResourceWarning`` filter alone would let a leaked connection escape on newer
# Pythons. Promote the wrapper to an error too so the leak fails the suite on
# every Python version, not just 3.12.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# FLOOR 93.0 — and the margin is THIN, not comfortable. Read this before
# interpreting a red coverage build.
#
# This comment used to say "set a few points under the current ~95% branch
# coverage so it catches a real regression without flaking on normal churn."
# Both halves were false by 2026-07-29: measured branch coverage is 93.11%, so
# the margin is 0.11 points — on the order of TWENTY statements-or-branches out
# of 14,404 statements + 5,332 branch outcomes. Corrected under D-8(a).
#
# Why that matters operationally: a two-point margin and a twenty-branch margin
# call for different reactions to the same red build. With two points, red means
# "you deleted tests or regressed behaviour." With twenty branches, red usually
# means "you ADDED code and did not cover all of it" — a different diagnosis and
# a different fix. Anyone reading the old comment would have reached for the
# wrong one.
#
# Recent trajectory, from commit evidence lines: 93.14 (c20ca47) -> 93.11
# (87d03c4) -> 93.10 (8fa7122..59414f1) -> 93.08 (6e6c9ad) -> 93.11 (current;
# the mutation-triage pins and the min-Python gate recovered it).
#
# It is a RATCHET: raise it as coverage improves; never lower it silently to make
# a red build pass. D-8(a) deliberately corrected only this COMMENT and left the
# number alone — moving a gate inside the change that gate would judge is the
# pattern the review packet exists to catch. Raising the floor to 93.1 is
# sequenced to the R6a close-out, where an independent verdict has cleared the
# work the number would be measuring.
fail_under = 93

[tool.ruff]
# The .ai-os/ (AI Project OS package) and .claude/ (ClaudeFast kit) trees are
# VENDORED tooling with their own upstream style — not this repo's application
# code — so `ruff check .` must not lint them. app/, tests/, cockpit/, harness/,
# and conftest.py remain fully linted. Pytest basetemps/cache are ignored runtime
# artifacts; excluding their entire basename class also keeps the exact Ruff
# gates reproducible when a Windows test subprocess leaves an unreadable ACL.
# "mutants" is mutmut 3.x's generated working tree (ADR-015): not source, and
# excluded so it cannot inflate the format-debt baseline the review re-checks.
extend-exclude = [".ai-os", ".claude", ".pytest*", "mutants"]
# D-7(a), ratified 2026-07-29: 3.11 and 3.12 are both supported, so 3.12-only
# syntax is illegal and must fail a gate rather than a reviewer's memory.
# Unset, ruff assumes its newest supported target and silently accepted a PEP 701
# nested-quote f-string that the 3.11 CI leg rejected — seven consecutive red
# builds, three of them under a "gates green" claim.
#
# WHAT THIS CATCHES, exactly, measured before adoption:
#   f"append_{"execution_event"}" in a source FILE
#     -> invalid-syntax: Cannot reuse outer quote character in f-strings on
#        Python 3.11 (syntax was added in Python 3.12)
#   the same text inside a STRING LITERAL that a test feeds to ast.parse
#     -> NOT caught by THIS setting. Ruff lints a file's own syntax; a fixture
#        stored as a string is opaque to it, and that is exactly the shape the
#        seven red builds took. Verified: `ruff check .` reports "All checks
#        passed!" on a file whose only content is such a fixture.
#        That gap is now closed by tests/test_min_python_syntax_gate.py, which
#        lints every embedded source string in tests/ at this same target in one
#        batched ruff run (~11.7k candidates, <0.3 s) and reports the originating
#        file and line. It needs no second interpreter, so it has identical force
#        on both matrix legs — unlike `ast.parse(src, feature_version=(3, 11))`,
#        which does NOT reject the construct (measured on 3.12; that parameter is
#        best-effort and does not gate PEP 701), and unlike shelling to a real
#        python3.11, which would skip wherever 3.11 is absent.
#
# Adopted with zero new findings on the tree at 3154e6c (`ruff check .` clean).
#
# THIS GATE DEPENDS ON THE RUFF VERSION, and only constraints.txt guarantees it.
# Verified on ruff 0.15.20 — the `constraints.txt` pin, which CI installs via
# `pip install -r requirements.txt -c constraints.txt`, so CI does fire it on
# both matrix legs (target-version is config, not interpreter-derived).
# `requirements.txt` declares `ruff>=0.6`, and that floor does NOT guarantee
# version-aware syntax diagnostics: an environment built without the constraints
# file can satisfy the requirement with a ruff that accepts the construct
# silently. Noted rather than left implicit — a control whose firing depends on
# an unstated version is the shape of defect this repo keeps finding.
target-version = "py311"

[tool.mypy]
# ADR-007: static typecheck gate over app/, introduced by baseline-and-ratchet.
python_version = "3.11"
ignore_missing_imports = true      # alpaca-py / streamlit ship no stubs
plugins = ["pydantic.mypy"]
warn_unused_ignores = true         # flipped 2026-07-11 (ADR-007 follow-up): burn-down complete

# Third-party transitive stubs — `alpaca-py` (imported by the broker adapter and
# the market-data stream) pulls in pandas / pyarrow / numpy, whose modern wheels
# ship inline `.pyi` stubs written with PEP 695 `type` statements. Under
# `python_version = "3.11"` mypy 2.x parses those stubs and hard-errors
# ("Type statement is only supported in Python 3.12 and greater"), which stops
# the whole `mypy app/` run before it checks our code — a pure dependency-drift
# break (unpinned mypy/numpy), not a defect in `app/`. We never typecheck these
# libraries (already expressed by `ignore_missing_imports` above), so tell mypy
# not to follow into them. Surgical: `app/` uses none of them directly, so this
# cannot change how our own code is checked. (Root fix is pinning deps — see
# work/review/FINDING-flatten-inv034-live-protection.md §"Secondary issue".)
[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*", "pyarrow.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# Grandfather punch-list (ADR-007): FULLY BURNED DOWN (WO-0012). The list started
# at 16 modules carrying pre-existing type debt and only ever shrank; every module
# — stores, engine, policy, facade, features, protection, strategy, reconciliation,
# factories, dev route, and both alpaca-py SDK adapters — is now typechecked with no
# `ignore_errors` override. The whole `app/` package is under the gate. (Third-party
# stub handling stays above via the numpy/pandas/pyarrow follow_imports override.)

[tool.mutmut]
# ADR-015: nightly mutation ratchet, scoped to the derived-truth kernel — the
# surface where hand-picked mutation checks have twice recorded proofs that a
# generated mutant later refuted (REV-0045 P0-2; REV-0038 F4). Widen the scope
# as baselines are established; never narrow it to make a red run pass.
source_paths = ["app/events/projectors.py"]
# mutmut copies ONLY source_paths into its mutants/ tree, so the rest of the
# package is missing and every test errors at import. `also_copy` brings the
# unmutated remainder along. Found the first time this job was actually run —
# see the ADR-015 delivery note.
also_copy = ["app", "tests", "conftest.py", "pyproject.toml"]
pytest_add_cli_args_test_selection = [
    # ENUMERATED LISTS ROT. This one was written before WO-0141 and still named
    # only these four files, so every pin added since — the ones that actually
    # exercise contributed_epoch_sequence, attribution, occupancy and the
    # release rule — was invisible to the ratchet. A mutant inverting the
    # dispatch in contributed_epoch_sequence survived a full run because the
    # test that pins it was not selected.
    #
    # tests/test_ratchet_selection_is_complete.py now fails the build when a
    # test module imports app.events.projectors and is absent from this list,
    # so the list cannot silently fall behind again. Same cure as the F-1
    # caller enumeration: machine-consumed, failure-capable, and it forces a
    # human to decide rather than letting the gap pass.
    "tests/test_signal_rails_remediation.py",
    "tests/test_signal_rails_projector.py",
    "tests/test_signal_rails_core.py",
    "tests/test_signal_rails_store.py",
    "tests/test_wo0141_rail_kernel.py",
    "tests/test_wo0141_rail_properties.py",
    "tests/test_wo0141_occupancy_leaks.py",
    "tests/test_wo0141_fold_store_recovery_agreement.py",
    "tests/test_wo0141_persisted_carrier_divergence.py",
    "tests/test_wo0141_mutation_triage_gaps.py",
    "tests/test_signal_projector_forward_compat.py",
    # The gate found these 14: they exercise the mutated module and were
    # never selected, which is why 270 mutants reported "no tests" and the
    # survivor count measured the SELECTION rather than the tests. If the
    # whole file is mutated, every suite that exercises the whole file must
    # run against it.
    "tests/test_signal_ingest_properties.py",
    "tests/test_signal_ingest_store.py",
    "tests/test_spine_phase2_event_log.py",
    "tests/test_spine_phase3b_overfill_quarantine.py",
    "tests/test_spine_phase3c_timeout_quarantine.py",
    "tests/test_spine_phase3d_trading_state.py",
    "tests/test_spine_phase3e_emergency_override.py",
    "tests/test_spine_phase4f_fsm_composition.py",
    "tests/test_wo0007b_stageb_projector.py",
    "tests/test_wo0007b_stagec_readiness.py",
    "tests/test_wo0007b_staged_readflip.py",
    "tests/test_wo0013_event_truth_writepath.py",
    "tests/test_wo0113_store_parity.py",
    "tests/test_wo0125_envelope_replay_parity.py",
]
